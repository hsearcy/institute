<!doctype html>
<!--
  Dev-only GLB inspector. Not an entry in the production build (vite builds
  index.html only), so it ships nothing to players. It reproduces the cavern's
  lighting rig, tone mapping and hero framing so a model judged here looks the
  same as it will on the mine target.

  Usage: /model-inspect.html?model=/assets/models/...&rotY=1.57&yaw=0
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Model inspect</title>
    <style>
      html, body { margin: 0; height: 100%; background: #120d1c; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      import {
        Scene, PerspectiveCamera, WebGLRenderer, ACESFilmicToneMapping, SRGBColorSpace,
        DirectionalLight, PointLight, HemisphereLight, PMREMGenerator, Group, Box3, Vector3,
      } from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const params = new URLSearchParams(location.search);
      const modelUrl = params.get('model');
      const rotY = parseFloat(params.get('rotY') ?? '0');
      const yaw = parseFloat(params.get('yaw') ?? '0');   // extra orbit for turntable frames
      const size = parseInt(params.get('size') ?? '900', 10);

      const alpha = params.get('alpha') === '1';   // transparent plate for shop thumbnails
      const renderer = new WebGLRenderer({ antialias: true, alpha });
      // Playwright's omitBackground only shows through if the PAGE is transparent
      // too, otherwise the body colour is what gets baked into the "cutout".
      if (alpha) { renderer.setClearAlpha(0); document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }
      renderer.setPixelRatio(1);
      renderer.setSize(size, size);
      renderer.toneMapping = ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.outputColorSpace = SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new Scene();
      const pmrem = new PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new PerspectiveCamera(50, 1, 0.1, 100);
      camera.position.set(0, 0, 6.2);
      camera.lookAt(0, 0, 0);

      // Same rig as the cavern so materials read identically.
      scene.add(new HemisphereLight(0x9a8cff, 0x140e26, 0.55));
      const key = new DirectionalLight(0xffe2b8, 1.25);
      key.position.set(3.4, 4.2, 4.0);
      scene.add(key);
      const rim = new DirectionalLight(0x6f9bff, 0.7);
      rim.position.set(-3.6, 1.8, -3.2);
      scene.add(rim);
      const gemLight = new PointLight(0xff5b4d, 2.4, 14, 2);
      gemLight.position.set(0, 0, 1.6);
      scene.add(gemLight);

      function fitObject(obj, target) {
        const box = new Box3().setFromObject(obj);
        const s = target / (Math.max(...box.getSize(new Vector3()).toArray()) || 1);
        obj.scale.multiplyScalar(s);
        obj.position.sub(box.getCenter(new Vector3()).multiplyScalar(s));
      }

      const report = { url: modelUrl, ok: false };
      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      loader.load(modelUrl, (gltf) => {
        const model = gltf.scene;
        // Measure BEFORE fitting so the report describes the authored asset.
        const raw = new Box3().setFromObject(model);
        let tris = 0, meshes = 0;
        const materials = new Set(), textures = new Set();
        model.traverse((o) => {
          if (!o.isMesh) return;
          meshes++;
          const g = o.geometry;
          tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
          for (const m of [o.material].flat()) {
            materials.add(m.name || m.uuid);
            for (const slot of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap']) {
              if (m[slot]?.image) textures.add(`${slot}:${m[slot].image.width}x${m[slot].image.height}`);
            }
          }
        });
        Object.assign(report, {
          ok: true, meshes, triangles: Math.round(tris),
          materials: [...materials].length, textures: [...textures],
          rawSize: raw.getSize(new Vector3()).toArray().map((n) => +n.toFixed(3)),
          rawCenter: raw.getCenter(new Vector3()).toArray().map((n) => +n.toFixed(3)),
        });

        const holder = new Group();
        model.rotation.y = rotY;
        holder.add(model);
        fitObject(holder, 4.4);
        holder.rotation.y = yaw;
        scene.add(holder);

        renderer.render(scene, camera);
        window.__inspect = report;
        document.title = 'ready';
      }, undefined, (err) => {
        report.error = String(err);
        window.__inspect = report;
        document.title = 'ready';
      });
    </script>
  </body>
</html>
