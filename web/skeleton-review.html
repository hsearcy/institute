<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character model review</title>
<style>
body{margin:0;background:#14191e;color:#e4e8ea;font:15px system-ui}header{padding:16px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:19px;margin:0}label{display:flex;align-items:center;gap:6px}select,button{background:#29323a;color:inherit;border:1px solid #62717d;border-radius:5px;padding:7px}#stage{height:calc(100dvh - 150px);min-height:300px}canvas{display:block}p{margin:8px 22px;color:#bfcad2}a{color:#99d3e5}
</style>
<header><h1>Character model review</h1>
<label>Model <select id="model"><option value="skeleton">Skeleton · Tripo</option><option value="guardian">Guardian · Tripo</option><option value="vault-guardian-boss">Vault Guardian Boss · Tripo</option><option value="skeleton-blender">Skeleton · Previous Blender model</option><option value="wraith">Wraith reference</option><option value="revenant">Revenant · Tripo</option></select></label>
<label>View <select id="view"><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option><option value="quarter">Three-quarter</option><option value="game">Game angle</option></select></label>
<label>Pose <select id="pose"><option value="rest">Rest</option><option value="walk">Walk</option><option value="attack">Attack</option><option value="fallen">Fallen</option></select></label>
<label>Light <select id="light"><option value="studio">Studio</option><option value="dungeon">Dungeon</option></select></label>
<button id="reload">Reload model</button></header>
<div id="stage"></div><p id="status">Loading model…</p><p>Drag to turn. Scroll to zoom. Right-drag to move. Tripo models are static review candidates. Select a model and view to inspect it.</p>
<script type="module">
import {Scene,PerspectiveCamera,WebGLRenderer,ACESFilmicToneMapping,DirectionalLight,HemisphereLight,PMREMGenerator,Box3,Vector3,Color,Clock} from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {EnemyAnimator} from './src/rpg/world/EnemyAnimator.ts';
const $=id=>document.getElementById(id), stage=$('stage'), renderer=new WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=ACESFilmicToneMapping;stage.append(renderer.domElement);
const scene=new Scene();scene.background=new Color('#20272d');
const pmrem=new PMREMGenerator(renderer), room=new RoomEnvironment(), env=pmrem.fromScene(room,.04);scene.environment=env.texture;room.dispose();pmrem.dispose();
const camera=new PerspectiveCamera(38,1,.01,100), controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const hemi=new HemisphereLight(0xc2d5e2,0x292521,1), key=new DirectionalLight(0xffebd5,3), fill=new DirectionalLight(0x9ccde8,1.5);key.position.set(3,5,4);fill.position.set(-3,3,-2);scene.add(hemi,key,fill);
let model,animator,rests=[],center=new Vector3(0,.8,0),radius=1,request=0;
const initial=new URLSearchParams(location.search).get('model');if(['skeleton','wraith','revenant','guardian','vault-guardian-boss','skeleton-blender'].includes(initial))$('model').value=initial;
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder), clock=new Clock();
function view(){const dirs={front:[0,.08,1],side:[1,.08,0],back:[0,.08,-1],quarter:[.65,.17,1],game:[17,25,20]};camera.position.copy(center).add(new Vector3(...dirs[$('view').value]).normalize().multiplyScalar(radius*3.5));controls.target.copy(center);controls.update();}
function dispose(object){const geometries=new Set(),materials=new Set(),textures=new Set();object.traverse(o=>{if(!o.isMesh)return;geometries.add(o.geometry);for(const m of [o.material].flat()){materials.add(m);for(const value of Object.values(m))if(value?.isTexture)textures.add(value);}});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());}
async function load(){const id=++request,kind=$('model').value;$('status').textContent='Loading model…';window.__review={ok:false};try{const gltf=await loader.loadAsync(({skeleton:'/assets/rpg/candidates/skeleton-tripo.glb',guardian:'/assets/rpg/candidates/guardian-tripo.glb','vault-guardian-boss':'/assets/rpg/candidates/vault-guardian-boss-tripo.glb','skeleton-blender':'/assets/rpg/candidates/skeleton-concept.glb',wraith:'/assets/rpg/wraith.glb',revenant:'/assets/rpg/candidates/revenant-tripo.glb'}[kind])+'?v='+Date.now());if(id!==request){dispose(gltf.scene);return;}if(model){scene.remove(model);dispose(model);}model=gltf.scene;scene.add(model);const box=new Box3().setFromObject(model),size=box.getSize(new Vector3());center=box.getCenter(new Vector3());radius=Math.max(size.x,size.y,size.z)/2;rests=[];let triangles=0,meshes=0;model.traverse(o=>{rests.push([o,o.position.clone(),o.quaternion.clone()]);if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});let revision='';if(kind==='skeleton-blender'){try{const meta=await fetch('/assets/rpg/candidates/skeleton-concept.json?v='+Date.now()).then(r=>r.json());if(id!==request)return;revision=` · Revision ${meta.revision} · ${meta.description}`;}catch{}}
animator=new EnemyAnimator(model,{kind:kind==='skeleton-blender'?'skeleton':kind,phase:0});$('pose').disabled=!animator.articulated;$('pose').value='rest';window.__review={ok:true,kind,meshes,triangles,articulated:animator.articulated,size:size.toArray()};$('status').textContent=`${{skeleton:'Skeleton · Tripo',guardian:'Guardian · Tripo','vault-guardian-boss':'Vault Guardian Boss · Tripo','skeleton-blender':'Previous Blender skeleton',wraith:'Wraith',revenant:'Revenant · Tripo'}[kind]}${revision} · ${Math.round(triangles).toLocaleString()} triangles · ${meshes} meshes · ${animator.articulated?'Joint motion available':'No joint motion'}`;view();}catch(error){$('status').textContent='Cannot load model: '+error.message;window.__review={ok:false,error:String(error)};}}
function light(){const dungeon=$('light').value==='dungeon';scene.environmentIntensity=dungeon?.075:.5;renderer.toneMappingExposure=dungeon?1.12:1;hemi.color.setHex(dungeon?0x7394aa:0xc2d5e2);hemi.groundColor.setHex(dungeon?0x15120f:0x292521);hemi.intensity=dungeon?.38:1;key.color.setHex(dungeon?0x6d8da5:0xffebd5);key.intensity=dungeon?1.5:3;key.position.set(...(dungeon?[-12,24,-10]:[3,5,4]));fill.position.set(...(dungeon?[15,12,18]:[-3,3,-2]));fill.color.setHex(dungeon?0xc6d3cf:0x9ccde8);fill.intensity=dungeon?.48:1.5;}
new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();}).observe(stage);
$('model').onchange=load;$('reload').onclick=load;$('view').onchange=view;$('light').onchange=light;
renderer.setAnimationLoop(()=>{const t=Number.isFinite(window.__reviewTime)?window.__reviewTime:clock.getElapsedTime();if(model){for(const [o,p,q]of rests){o.position.copy(p);o.quaternion.copy(q);if(o.morphTargetInfluences)o.morphTargetInfluences.fill(0);}const pose=$('pose').value;if(pose==='walk')animator.update(t,{moving:1});if(pose==='attack')animator.update(t,{moving:0,threat:1});if(pose==='fallen')animator.update(2,{deathAge:1.2,collapse:'grounded'});}controls.update();renderer.render(scene,camera);});light();load();
</script>
</html>
