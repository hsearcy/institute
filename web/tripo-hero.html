<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Tripo hero · model viewer</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dddcd6;font-family:system-ui,sans-serif;color:#26342f}canvas{display:block;width:100%;height:100%}.panel{position:fixed;top:16px;left:16px;max-width:310px;background:#fffffff0;border:1px solid #aab6ad;border-radius:9px;padding:16px;box-shadow:0 8px 25px #35473920}h1{font-size:17px;margin:0 0 9px}p{font-size:12px;line-height:1.6;margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:6px}button{cursor:pointer;border:1px solid #9aaea2;border-radius:4px;padding:7px 10px;background:#f7faf5;color:#243e30}button[aria-pressed=true]{background:#254e3a;color:#fff}button:focus-visible{outline:2px solid #42725a;outline-offset:2px}#status.error{color:#9b2525}body.capture .panel{display:none}.note{color:#627267}@media(max-width:600px){.panel{max-width:calc(100vw - 24px);left:12px;top:12px;padding:12px}}
  </style>
</head>
<body>
  <canvas id="tripo-canvas" aria-label="New Tripo hero model"></canvas>
  <aside class="panel"><h1>Tripo hero study</h1><nav aria-label="Camera view"><button data-view="front">Front</button><button data-view="threequarter">Three-quarter</button><button data-view="back">Back</button><button data-view="face">Face</button></nav><p id="status" role="status">Loading the new hero…</p><p class="note">Drag to orbit. Scroll to zoom. Press H to hide controls.</p></aside>
  <script type="module" src="/src/tripo-hero.ts"></script>
</body>
</html>
