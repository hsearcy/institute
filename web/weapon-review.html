<!doctype html><html lang="en"><meta charset="utf-8"><title>Weapon concept review</title><style>body{margin:0;background:#24282b;color:#eee;font:16px system-ui}header{padding:12px}select,button{font:inherit}main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 55px)}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}#concept,#model{height:70vh!important}}#concept{width:100%;height:100%;object-fit:contain;background:#d2cec7}#model{width:100%;height:100%;position:relative}canvas{display:block}#status{position:absolute;bottom:5px;font-size:12px;padding:8px}</style><header>Weapon <select id="item"></select> View <select id="angle"><option value="0">Front</option><option value="1.570796">Side</option><option value="3.141593">Back</option><option value="0.55">Three-quarter</option></select> <span>Concept art and model</span> <strong id="score"></strong></header><main><img id="concept"><div id="model"><div id="status"></div></div></main><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ITEM_MODELS}from'./src/rpg/itemModels.ts';
const q=s=>document.querySelector(s),scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(1);renderer.setSize(900,900);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;q('#model').prepend(renderer.domElement);scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x41404a,1));for(const [x,y,z,p]of [[3,4,5,2],[-3,1,2,1],[0,3,-4,2]]){const l=new T.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}const camera=new T.OrthographicCamera(-.65,.65,.65,-.65,.01,100);camera.position.set(0,0,4);const controls=new OrbitControls(camera,renderer.domElement);controls.addEventListener('change',()=>renderer.render(scene,camera));let model;const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);for(const id of Object.keys(ITEM_MODELS)){q('#item').add(new Option(id,id))}
async function load(id){window.__weaponReady=false;q('#score').textContent=new URLSearchParams(location.search).get('candidate')==='1'?'Review copy':'Installed game model';if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of [o.material].flat()){for(const v of Object.values(m))if(v?.isTexture)v.dispose();m.dispose()}}})}q('#item').value=id;q('#concept').src='/@fs/home/hfsearcy/git/institute/docs/concepts/enemy-character-references/weapons/'+id+'.png';const gltf=await loader.loadAsync('/assets/rpg/items/'+(new URLSearchParams(location.search).get('candidate')==='1'?'candidates/':'')+id+'.glb?v='+Date.now());model=gltf.scene;const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),scale=1.08/Math.max(size.x,size.y,size.z);model.scale.multiplyScalar(scale);model.position.sub(box.getCenter(new T.Vector3()).multiplyScalar(scale));const holder=new T.Group();holder.add(model);model=holder;scene.add(model);let triangles=0,meshes=0;model.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3}});window.__weapon={id,triangles,meshes,size:size.toArray()};q('#status').textContent=JSON.stringify(window.__weapon);view(+q('#angle').value);await q('#concept').decode();window.__weaponReady=true}
function view(angle){const option=[...q('#angle').options].find(o=>Math.abs(+o.value-angle)<.001);if(option)q('#angle').value=option.value;model.rotation.y=angle;camera.position.set(0,0,4);controls.target.set(0,0,0);controls.update();renderer.render(scene,camera)}q('#item').onchange=()=>load(q('#item').value);q('#angle').onchange=()=>view(+q('#angle').value);function resize(){const w=q('#model').clientWidth,h=q('#model').clientHeight;renderer.setSize(w,h);camera.left=-.65*w/h;camera.right=.65*w/h;camera.updateProjectionMatrix();renderer.render(scene,camera)}window.addEventListener('resize',resize);resize();window.__weaponReview={load,view,thumbnail(){q('#concept').style.visibility='hidden';q('#status').style.visibility='hidden';renderer.setClearAlpha(0);renderer.setSize(512,512);camera.left=-.65;camera.right=.65;camera.updateProjectionMatrix();view(.55);return renderer.domElement.toDataURL('image/png')}};await load(new URLSearchParams(location.search).get('item')||'apprentice');</script></html>
